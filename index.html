<!DOCTYPE html>
<html>
<head>
    <title>Number to Words (0-999)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        input {
            padding: 8px;
            font-size: 16px;
            width: 120px;
        }

        button {
            padding: 8px 12px;
            font-size: 16px;
            margin-left: 5px;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            font-size: 22px;
            color: darkgreen;
        }

        #error {
            margin-top: 10px;
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h2>Convert Number to Words (0–999)</h2>

<input type="text" id="numberInput" maxlength="3" placeholder="Enter number">
<button onclick="convertNumber()">Convert</button>

<div id="result"></div>
<div id="error"></div>

<script>
function convertNumber() {
    const input = document.getElementById("numberInput").value.trim();
    const result = document.getElementById("result");
    const error = document.getElementById("error");

    result.textContent = "";
    error.textContent = "";

    // Validate input: only digits, 1-3 digits
    if (!/^\d{1,3}$/.test(input)) {
        error.textContent = "Please enter a valid number between 0 and 999 (digits only).";
        return;
    }

    const number = parseInt(input);

    if (number < 0 || number > 999) {
        error.textContent = "Number must be between 0 and 999.";
        return;
    }

    result.textContent = numberToWords(number);
}

function numberToWords(num) {
    const ones = ["Zero","One","Two","Three","Four","Five","Six","Seven","Eight","Nine"];
    const teens = ["Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen",
                   "Sixteen","Seventeen","Eighteen","Nineteen"];
    const tens = ["","","Twenty","Thirty","Forty","Fifty",
                  "Sixty","Seventy","Eighty","Ninety"];

    if (num < 10) return ones[num];

    if (num < 20) return teens[num - 10];

    if (num < 100) {
        return tens[Math.floor(num / 10)] +
               (num % 10 !== 0 ? " " + ones[num % 10] : "");
    }

    return ones[Math.floor(num / 100)] + " Hundred" +
           (num % 100 !== 0 ? " " + numberToWords(num % 100) : "");
}
</script>

</body>
</html>
